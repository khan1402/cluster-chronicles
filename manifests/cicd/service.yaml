# service.yaml - stable address for the Jenkins controller.
#
# Used by:
#   - the Ingress (browser -> Jenkins UI)
#   - build pods connecting back to Jenkins (WebSocket on the same port 8080)
#     at http://jenkins.cicd.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: cicd
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: http
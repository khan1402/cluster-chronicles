# serviceaccount.yaml - identities for Jenkins inside the cluster.
#
# A ServiceAccount is an identity for PODS (users are for people). Kubernetes
# mounts its token into the pod, and every API call from the pod is checked
# against the Roles bound to that account (rbac.yaml).
#
# Two accounts on purpose (least privilege):
#   jenkins          - the Jenkins controller: starts and removes build pods
#   jenkins-deployer - the build pods: update the app's Deployments
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: cicd
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: cluster-chronicles
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: cicd
  labels:
    app.kubernetes.io/name: jenkins-agent
    app.kubernetes.io/part-of: cluster-chronicles
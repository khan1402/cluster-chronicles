# Grafana dashboard "Pods and Containers" - loaded automatically by Grafana's
# dashboard sidecar (label grafana_dashboard="1", folder from the annotation).
# GENERATED by scripts/build-dashboards.py - do not edit by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-pods-containers
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: "cluster-chronicles"
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Cluster Chronicles"
data:
  pods-containers.json: |
    {
      "uid": "pods-containers",
      "title": "Pods and Containers",
      "description": "Per pod and container: CPU, memory against its limit, restarts and network traffic.",
      "tags": ["cluster-chronicles"],
      "editable": false,
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(kube_pod_info, namespace)", "refId": "V"},
            "definition": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "sort": 1
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)", "refId": "V"},
            "definition": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {"selected": true, "text": ["All"], "value": ["$__all"]},
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Health",
          "collapsed": false,
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1},
          "panels": [],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Pods running",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 1, "w": 6, "h": 4},
          "fieldConfig": {
            "defaults": {"unit": "none", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}},
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\",namespace=~\"$namespace\",pod=~\"$pod\"})",
              "instant": true
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Restarts (last 15 min)",
          "description": "Alert: one container restarting more than 3 times in 15 minutes.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 6, "y": 1, "w": 6, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 4}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\",pod=~\"$pod\"}[15m])) or vector(0)",
              "instant": true
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Highest memory vs limit",
          "description": "The container closest to its memory limit. Alert: above 80%.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 1, "w": 6, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 70},
                  {"color": "red", "value": 80}
                ]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "max(max by (namespace, pod, container) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\",namespace=~\"$namespace\",pod=~\"$pod\"}) / max by (namespace, pod, container) (kube_pod_container_resource_limits{resource=\"memory\",namespace=~\"$namespace\",pod=~\"$pod\"})) * 100",
              "instant": true
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Containers waiting",
          "description": "Containers not started yet or crashing (e.g. CrashLoopBackOff, ImagePullBackOff).",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 18, "y": 1, "w": 6, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_container_status_waiting{namespace=~\"$namespace\",pod=~\"$pod\"}) or vector(0)",
              "instant": true
            }
          ],
          "id": 5
        },
        {
          "type": "row",
          "title": "CPU and memory",
          "collapsed": false,
          "gridPos": {"x": 0, "y": 5, "w": 24, "h": 1},
          "panels": [],
          "id": 6
        },
        {
          "type": "timeseries",
          "title": "CPU per container",
          "description": "1 = one full CPU core.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "cores", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",namespace=~\"$namespace\",pod=~\"$pod\"}[$__rate_interval]))",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ],
          "id": 7
        },
        {
          "type": "timeseries",
          "title": "Memory per container (working set)",
          "description": "The memory the kernel counts against the container's limit (OOM kill above it).",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 6, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod, container) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\",namespace=~\"$namespace\",pod=~\"$pod\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ],
          "id": 8
        },
        {
          "type": "timeseries",
          "title": "Memory vs limit",
          "description": "Only containers WITH a memory limit. Alert: above 80%.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 14, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "percent", "custom": {"fillOpacity": 10, "showPoints": "never"}, "min": 0, "max": 100},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * max by (namespace, pod, container) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\",namespace=~\"$namespace\",pod=~\"$pod\"}) / max by (namespace, pod, container) (kube_pod_container_resource_limits{resource=\"memory\",namespace=~\"$namespace\",pod=~\"$pod\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ],
          "id": 9
        },
        {
          "type": "timeseries",
          "title": "Restarts (last 15 min, per container)",
          "description": "Alert: more than 3 in 15 minutes.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 14, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "none", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\",pod=~\"$pod\"}[15m])",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ],
          "id": 10
        },
        {
          "type": "row",
          "title": "Network",
          "collapsed": false,
          "gridPos": {"x": 0, "y": 22, "w": 24, "h": 1},
          "panels": [],
          "id": 11
        },
        {
          "type": "timeseries",
          "title": "Network received per pod",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 23, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (rate(container_network_receive_bytes_total{namespace=~\"$namespace\",pod=~\"$pod\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 12
        },
        {
          "type": "timeseries",
          "title": "Network sent per pod",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 23, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (rate(container_network_transmit_bytes_total{namespace=~\"$namespace\",pod=~\"$pod\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 13
        },
        {
          "type": "table",
          "title": "Restarts since start, per container",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 31, "w": 24, "h": 8},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "options": {"showHeader": true},
          "targets": [
            {
              "refId": "A",
              "expr": "max by (namespace, pod, container) (kube_pod_container_status_restarts_total{namespace=~\"$namespace\",pod=~\"$pod\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "restarts"}}
            }
          ],
          "id": 14
        }
      ],
      "annotations": {"list": []}
    }

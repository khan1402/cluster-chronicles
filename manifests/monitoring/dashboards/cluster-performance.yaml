# Grafana dashboard "Cluster Performance" - loaded automatically by Grafana's
# dashboard sidecar (label grafana_dashboard="1", folder from the annotation).
# GENERATED by scripts/build-dashboards.py - do not edit by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cluster-performance
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: "cluster-chronicles"
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Cluster Chronicles"
data:
  cluster-performance.json: |
    {
      "uid": "cluster-performance",
      "title": "Cluster Performance",
      "description": "Overall cluster health: nodes, CPU, memory, disk, network, pods and workloads.",
      "tags": ["cluster-chronicles"],
      "editable": false,
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "templating": {"list": []},
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 1},
          "panels": [],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Nodes ready",
          "description": "Nodes whose kubelet reports Ready.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 1, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {"unit": "none", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}},
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "instant": true
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Pods running",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 4, "y": 1, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {"unit": "none", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}},
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "instant": true}],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Pods pending",
          "description": "Pods waiting for a node (usually not enough CPU or memory). Alert: pending over 5 minutes.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 8, "y": 1, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 3}]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{phase=\"Pending\"}) or vector(0)", "instant": true}],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Pods failed",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 1, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{phase=\"Failed\"}) or vector(0)", "instant": true}],
          "id": 5
        },
        {
          "type": "stat",
          "title": "Cluster CPU",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 16, "y": 1, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 70},
                  {"color": "red", "value": 80}
                ]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "instant": true
            }
          ],
          "id": 6
        },
        {
          "type": "stat",
          "title": "Cluster memory",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 20, "y": 1, "w": 4, "h": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 80},
                  {"color": "red", "value": 90}
                ]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))",
              "instant": true
            }
          ],
          "id": 7
        },
        {
          "type": "row",
          "title": "Nodes",
          "collapsed": false,
          "gridPos": {"x": 0, "y": 5, "w": 24, "h": 1},
          "panels": [],
          "id": 8
        },
        {
          "type": "timeseries",
          "title": "CPU usage per node",
          "description": "Share of CPU time not idle. Alert: above 80% for 5 minutes.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "percent", "custom": {"fillOpacity": 10, "showPoints": "never"}, "min": 0, "max": 100},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])))",
              "legendFormat": "{{instance}}"
            }
          ],
          "id": 9
        },
        {
          "type": "timeseries",
          "title": "Memory usage per node",
          "description": "RAM in use (cache that can be freed is not counted). Alert: above 90% for 5 minutes.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 6, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "percent", "custom": {"fillOpacity": 10, "showPoints": "never"}, "min": 0, "max": 100},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{instance}}"
            }
          ],
          "id": 10
        },
        {
          "type": "bargauge",
          "title": "Disk space used (/)",
          "description": "Root filesystem of the node. Alert: less than 20% free (above 80% used).",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 14, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 70},
                  {"color": "red", "value": 85}
                ]
              }
            },
            "overrides": []
          },
          "options": {"orientation": "horizontal", "displayMode": "gradient", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})",
              "legendFormat": "{{instance}}",
              "instant": true
            }
          ],
          "id": 11
        },
        {
          "type": "timeseries",
          "title": "Load average (1 min)",
          "description": "Processes waiting for CPU. Above the number of cores = the node is overloaded.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 14, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [{"refId": "A", "expr": "node_load1", "legendFormat": "{{instance}}"}],
          "id": 12
        },
        {
          "type": "timeseries",
          "title": "Network received",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 22, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (instance) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|docker.*|br-.*|cni.*\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}"
            }
          ],
          "id": 13
        },
        {
          "type": "timeseries",
          "title": "Network sent",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 22, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (instance) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|docker.*|br-.*|cni.*\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}"
            }
          ],
          "id": 14
        },
        {
          "type": "row",
          "title": "Workloads",
          "collapsed": false,
          "gridPos": {"x": 0, "y": 30, "w": 24, "h": 1},
          "panels": [],
          "id": 15
        },
        {
          "type": "timeseries",
          "title": "Running pods per namespace",
          "description": "",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 31, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "none", "custom": {"fillOpacity": 10, "showPoints": "never"}}, "overrides": []},
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "{{namespace}}"
            }
          ],
          "id": 16
        },
        {
          "type": "timeseries",
          "title": "Requested vs allocatable (whole cluster)",
          "description": "How much of the node the pods have RESERVED (requests). Near 100% = new pods stay Pending.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 31, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "percent", "custom": {"fillOpacity": 10, "showPoints": "never"}, "min": 0, "max": 100},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})",
              "legendFormat": "CPU requested"
            },
            {
              "refId": "B",
              "expr": "100 * sum(kube_pod_container_resource_requests{resource=\"memory\"}) / sum(kube_node_status_allocatable{resource=\"memory\"})",
              "legendFormat": "memory requested"
            }
          ],
          "id": 17
        },
        {
          "type": "table",
          "title": "Deployments: available vs desired replicas",
          "description": "Every Deployment with the number of replicas that are ready right now.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 39, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "options": {"showHeader": true},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, deployment) (kube_deployment_status_replicas_available)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "available replicas"}}
            }
          ],
          "id": 18
        },
        {
          "type": "table",
          "title": "Pods not Running",
          "description": "Pending, Failed or Unknown pods. Empty table = all good.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 39, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "options": {"showHeader": true},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod, phase) (kube_pod_status_phase{phase!=\"Running\",phase!=\"Succeeded\"} == 1)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "count"}}}],
          "id": 19
        }
      ],
      "annotations": {"list": []}
    }

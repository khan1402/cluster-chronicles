# deployment.yaml - the web frontend: 2 replicas behind one Service.
# (The HPA in hpa.yaml can scale this between 2 and 5 pods.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  # One new pod at a time, never fewer than 2 ready pods during an update.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: cluster-chronicles
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: zeek14/chronicles-frontend:initial
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Every key in the ConfigMap becomes an environment variable (BACKEND_URL)
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 100m              # the HPA measures CPU as a % of THIS value
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # /health, not "/": if the backend is down, the frontend stays ready
          # and shows its "Backend unreachable" page instead of disappearing.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
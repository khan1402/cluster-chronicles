# hpa.yaml - Horizontal Pod Autoscaler for the frontend (extra requirement).
#
# Every 15 s the HPA reads CPU use from metrics-server and compares it with
# the pods' CPU REQUEST (100m). Above 50% on average -> add pods; well below
# -> remove pods. Never fewer than 2, never more than 5.
#
# Scale-down waits 60 s (default 300 s) so the demo fits in a 45-min review.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
# kibana.yaml - the web UI for searching the logs and showing log dashboards.
#
# Kibana keeps nothing important on its own disk: dashboards, data views and
# settings are stored IN Elasticsearch (the .kibana index). So a Deployment
# (no persistent volume) is enough - a new Kibana pod finds everything again.
#
#   http://kibana.192.168.0.122.nip.io/   (Ingress in manifests/ingress/)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: cluster-chronicles
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.2   # must match the Elasticsearch version
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'
            - name: SERVER_PUBLICBASEURL
              value: http://kibana.192.168.0.122.nip.io
            - name: TELEMETRY_OPTIN
              value: "false"
            # Kibana is Node.js: cap its JavaScript heap below the container limit
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
          ports:
            - name: http
              containerPort: 5601
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The first start prepares the UI: allow up to 5 minutes.
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
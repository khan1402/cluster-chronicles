# elasticsearch-exporter.yaml - Elasticsearch health as Prometheus metrics.
#
# Prometheus can't read Elasticsearch's own API, so this small exporter asks
# Elasticsearch for its cluster health every scrape and turns the answer into
# metrics, e.g.:
#   elasticsearch_cluster_health_status{color="green"}   1 = current colour
#   elasticsearch_cluster_health_number_of_nodes          2
# The ElasticsearchClusterNotGreen alert (alert-rules.yaml) uses the first one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch-exporter
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-exporter
        app.kubernetes.io/part-of: cluster-chronicles
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534             # "nobody"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
          args:
            - --es.uri=http://elasticsearch:9200
            - --es.timeout=10s
          ports:
            - name: metrics
              containerPort: 9114
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-exporter
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch-exporter
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch-exporter
  ports:
    - name: metrics
      port: 9114
      targetPort: metrics
---
# Prometheus finds the exporter through this ServiceMonitor (service discovery).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: elasticsearch-exporter
  namespace: logging
  labels:
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-exporter
  endpoints:
    - port: metrics
      interval: 30s
# elasticsearch.yaml - a 2-node Elasticsearch cluster that stores the logs.
#
#   elasticsearch-0   master + data   (the only node that can be master)
#   elasticsearch-1   data only       (holds the second copy of every index)
#
# Every index has 1 replica: the primary copy on one node, the replica on the
# other. Stop elasticsearch-1 and the cluster turns YELLOW (all data still
# there, but only once). Only elasticsearch-0 may be master, so the cluster
# never has to vote between two equal masters (with 2 voters, losing one
# would leave no majority and the whole cluster would stop).
#
# StatefulSet (not Deployment): each pod keeps its NAME (elasticsearch-0/-1)
# and its OWN disk across restarts - exactly what a database node needs.
#
# Security: the built-in TLS/passwords are switched off to keep the lab small.
# Instead, Elasticsearch is never exposed outside the cluster (ClusterIP only,
# no Ingress), and the network policies (Part C) allow port 9200 only from
# Fluent Bit, Kibana, the exporter and the setup Job.

# --- Headless Service: gives each pod a stable DNS name for cluster traffic ---
# elasticsearch-0.elasticsearch-headless.logging.svc, ...-1...
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  clusterIP: None
  publishNotReadyAddresses: true      # nodes must find each other BEFORE they are ready
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
    - name: transport
      port: 9300
---
# --- Client Service: one address for Fluent Bit, Kibana and the exporter ---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  serviceName: elasticsearch-headless
  replicas: 2
  podManagementPolicy: Parallel        # start both nodes at once (faster)
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: cluster-chronicles
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The PV folder is created root-owned; Elasticsearch runs as UID 1000
        # (group 0, as the official image expects). Root, CHOWN capability only.
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 1000:0 /usr/share/elasticsearch/data && echo 'data owned by 1000:0'"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
          # Same image for both pods; the ROLE depends on the pod's number.
          # (Setting names contain dots, so they are passed with "env".)
          command: ["bash", "-c"]
          args:
            - |
              if [[ "${POD_NAME##*-}" == "0" ]]; then ROLES="master,data,ingest"; else ROLES="data,ingest"; fi
              echo "Starting ${POD_NAME} with roles: ${ROLES}"
              exec env "node.roles=${ROLES}" /usr/local/bin/docker-entrypoint.sh eswrapper
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: node.name
              value: "$(POD_NAME)"
            - name: cluster.name
              value: cluster-chronicles
            # Find the other node through the headless Service
            - name: discovery.seed_hosts
              value: elasticsearch-headless
            # Only used the very first time the cluster forms
            - name: cluster.initial_master_nodes
              value: elasticsearch-0
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: xpack.ml.enabled            # machine learning: not needed, saves memory
              value: "false"
            # Java heap = half of the memory limit; the other half is the OS
            # file cache, which makes searches fast.
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            # Disk watermarks as FREE SPACE (not %): Elasticsearch keeps working
            # while at least 3 GB is free. Keeps the low-disk alert demo
            # (node at ~82% used) from also blocking the log indices.
            - name: cluster.routing.allocation.disk.watermark.low
              value: 3gb
            - name: cluster.routing.allocation.disk.watermark.high
              value: 2gb
            - name: cluster.routing.allocation.disk.watermark.flood_stage
              value: 1gb
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Java needs time to start: allow up to 5 minutes.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # Ready = this node answers (local=true: don't wait for the whole cluster)
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fs 'http://localhost:9200/_cluster/health?local=true' >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: transport
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  # One claim PER POD (data-elasticsearch-0, data-elasticsearch-1), each bound
  # to one of the two "elasticsearch" PVs from manifests/storage/.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: elasticsearch
      spec:
        storageClassName: manual
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
        selector:
          matchLabels:
            storage.cluster-chronicles/for: elasticsearch
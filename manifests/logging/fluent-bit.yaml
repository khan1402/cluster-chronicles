# fluent-bit.yaml - collects every log on the node and ships it to Elasticsearch.
#
# DaemonSet: exactly ONE Fluent Bit pod on EVERY node - a new node gets its
# own collector automatically.
#
# What it reads (from the node, through hostPath mounts):
#   /var/log/containers/*.log  stdout/stderr of EVERY container in EVERY pod
#                              (app, Jenkins, Kubernetes system components...)
#   systemd journal            the node's own services: kubelet and containerd
#
# What it does with each line:
#   1. cri parser       - splits the containerd log format: time, stream, log
#   2. kubernetes filter- asks the API server which pod the file belongs to and
#                         adds kubernetes.namespace_name, pod_name, container_name,
#                         host, labels. Only the app's lines (namespace "app") are
#                         parsed as JSON into "app." fields (app.level, app.status...)
#   3. es output        - one index per day: k8s-containers-YYYY.MM.DD,
#                         k8s-node-YYYY.MM.DD (deleted after 3 days by ILM)
#
# Its own metrics (port 2020) are scraped by Prometheus: delivery errors and
# retries feed the FluentBitOutputErrors alert, read records feed
# FluentBitNoLogsCollected.

# --- Identity + read-only access to pod and namespace metadata --------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: cluster-chronicles
---
# ClusterRole (not Role): pods live in EVERY namespace. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
  labels:
    app.kubernetes.io/part-of: cluster-chronicles
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
  labels:
    app.kubernetes.io/part-of: cluster-chronicles
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
---
# --- Configuration -------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: cluster-chronicles
data:
  fluent-bit.conf: |
    [SERVICE]
        Daemon        Off
        Flush         5
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        # Metrics + health endpoint for Prometheus and the probes
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    # The app's own containers (namespace "app"): their lines are JSON and get
    # parsed into fields. Kept apart from everything else on purpose: other
    # programs (Elasticsearch, Kibana) also log JSON, with fields of the SAME
    # name but a different type (e.g. "service" is an object in Kibana's logs,
    # text in the app's). Mixed in one index, Elasticsearch rejects the lines.
    [INPUT]
        Name              tail
        Tag               app.*
        Path              /var/log/containers/*_app_*.log
        multiline.parser  cri
        DB                /var/lib/fluent-bit/tail-app.db
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # Every other container's stdout/stderr. containerd writes the "cri" format.
    # DB: remembers how far each file was read, so a restart doesn't resend.
    # Mem_Buf_Limit: if Elasticsearch is slow, buffer at most 20 MB, then pause.
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*_app_*.log
        multiline.parser  cri
        DB                /var/lib/fluent-bit/tail-containers.db
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # The node's own services (systemd journal, kept in memory under /run).
    [INPUT]
        Name              systemd
        Tag               node.*
        Path              /run/log/journal
        Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
        Systemd_Filter    _SYSTEMD_UNIT=containerd.service
        DB                /var/lib/fluent-bit/systemd.db
        Read_From_Tail    On
        Strip_Underscores On

    # App lines: add pod metadata AND parse the JSON into fields under "app"
    # (app.level, app.status, app.path, app.duration_ms ...).
    [FILTER]
        Name                 kubernetes
        Match                app.*
        Kube_Tag_Prefix      app.var.log.containers.
        Merge_Log            On
        Merge_Log_Key        app
        Keep_Log             Off
        K8S-Logging.Parser   On
        K8S-Logging.Exclude  On
        Labels               On
        Annotations          Off
        Buffer_Size          0

    # All other lines: add pod metadata only; the line stays text in "log".
    [FILTER]
        Name                 kubernetes
        Match                kube.*
        Kube_Tag_Prefix      kube.var.log.containers.
        Merge_Log            Off
        K8S-Logging.Exclude  On
        Labels               On
        Annotations          Off
        Buffer_Size          0

    # App + all other containers -> one index per day
    [OUTPUT]
        Name                es
        Match_Regex         ^(app|kube)\..*
        Host                elasticsearch.logging.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     k8s-containers
        Suppress_Type_Name  On
        Replace_Dots        On
        Generate_ID         On
        Trace_Error         On
        Retry_Limit         5

    [OUTPUT]
        Name                es
        Match               node.*
        Host                elasticsearch.logging.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     k8s-node
        Suppress_Type_Name  On
        Replace_Dots        On
        Generate_ID         On
        Trace_Error         On
        Retry_Limit         5
---
# --- The collector: one pod per node ----------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/part-of: cluster-chronicles
    spec:
      serviceAccountName: fluent-bit
      # Runs on every node, including control-plane nodes with taints
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:5.1.3
          args:
            - --config=/fluent-bit/etc/conf/fluent-bit.conf
          ports:
            - name: http
              containerPort: 2020
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # Root, because the node's log files belong to root - but with NO
          # Linux capabilities, a read-only filesystem and read-only log mounts.
          # This (hostPath) is why the "logging" namespace allows privileged pods.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/conf
              readOnly: true
            - name: varlog                 # /var/log/containers -> /var/log/pods
              mountPath: /var/log
              readOnly: true
            - name: journal                # the node's systemd journal (in memory: /run)
              mountPath: /run/log/journal
              readOnly: true
            - name: state                  # read positions (DB files), survive restarts
              mountPath: /var/lib/fluent-bit
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: journal
          hostPath:
            path: /run/log/journal
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluent-bit
  ports:
    - name: http
      port: 2020
      targetPort: http
---
# Prometheus scrapes Fluent Bit's own metrics (records read, errors, retries).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  endpoints:
    - port: http
      path: /api/v2/metrics/prometheus
      interval: 15s
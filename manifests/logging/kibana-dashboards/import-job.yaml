# import-job.yaml - loads the 3 Kibana dashboards (dashboards as code).
#
# The saved objects (2 data views, searches, visualizations, 3 dashboards) are
# in the kibana-dashboards ConfigMap, generated by scripts/build-dashboards.py.
# This Job waits until Kibana is up, then sends them to Kibana's import API.
# overwrite=true: running it again updates the dashboards in place.
#
# To run it again (e.g. after changing the dashboards):
#   python3 scripts/build-dashboards.py
#   kubectl apply -f manifests/logging/kibana-dashboards/dashboards-configmap.yaml
#   kubectl delete job kibana-dashboards-import -n logging --ignore-not-found
#   kubectl apply -f manifests/logging/kibana-dashboards/import-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-dashboards-import
  namespace: logging
  labels:
    app.kubernetes.io/name: kibana-dashboards-import
    app.kubernetes.io/part-of: cluster-chronicles
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana-dashboards-import
        app.kubernetes.io/part-of: cluster-chronicles
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          image: curlimages/curl:8.11.1
          command: ["sh", "-c"]
          args:
            - |
              set -e
              KIBANA=http://kibana:5601
              echo "Waiting for Kibana..."
              until curl -fs "$KIBANA/api/status" | grep -q '"level":"available"'; do sleep 10; done
              echo "== Importing dashboards"
              curl -fsS -X POST "$KIBANA/api/saved_objects/_import?overwrite=true" \
                -H "kbn-xsrf: true" \
                --form file=@/dashboards/dashboards.ndjson
              echo
              echo "Kibana dashboards imported."
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
      volumes:
        - name: dashboards
          configMap:
            name: kibana-dashboards